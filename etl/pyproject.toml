[project]
name = "legalsearchetl"
version = "0.1.0"
description = "ETL service for LegalSearch"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy",
    "psycopg2-binary",
    "beautifulsoup4",
    "pymupdf",
    "python-dotenv",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
