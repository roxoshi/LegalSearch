version: '3.8'

services:
  postgres-test:
    image: pgvector/pgvector:pg15
    container_name: legalsearch-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: legalsearch_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d legalsearch_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
