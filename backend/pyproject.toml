[project]
name = "legalsearchbackend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "pgvector",
    "sentence-transformers",
    "pydantic-settings",
    "python-dotenv>=1.2.1",
    "pymupdf",
    "beautifulsoup4",
    "pdfplumber",
    "pandas",
    "pyarrow",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
