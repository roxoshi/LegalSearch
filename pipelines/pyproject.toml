[project]
name = "legalsearchpipelines"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
   "beautifulsoup4",
   "pymupdf>=1.26.7",
   "tools>=1.0.17",
   "pdfplumber",
   "pandas",
   "pyarrow",
   "tqdm",
]

[project.optional-dependencies]
# ML dependencies for NER filter step - install with: uv sync --extra ml
# Then download the NER model: uv run python scripts/install_spacy_model.py
ml = [
   "spacy>=3.7.0",
   "spacy-transformers>=1.2.0",
   "torch>=2.0.0",
   "cupy-cuda12x>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
