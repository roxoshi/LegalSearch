[project]
name = "legalsearchpipelines"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
   "beautifulsoup4",
   "pymupdf>=1.26.7",
   "tools>=1.0.17",
   "pdfplumber",
   "pandas",
   "pyarrow",
   "tqdm",
   "spacy>=3.8.11",
   "scikit-learn>=1.8.0",
   "joblib>=1.5.3",
]

[project.optional-dependencies]
# ML dependencies for NER filter step - install with: uv sync --extra ml
# Then download the NER model: uv run python scripts/install_spacy_model.py
ml = [
   "spacy>=3.7.0",
   "spacy-transformers>=1.2.0",
   "torch>=2.0.0",
   "cupy-cuda12x>=13.0.0",
]

# LLM provider SDKs - install with: uv sync --extra llm
# Set the appropriate API key env var before running:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, or GOOGLE_API_KEY
llm = [
   "anthropic>=0.40.0",
   "openai>=1.0.0",
   "google-generativeai>=0.8.0",
   "tiktoken>=0.7.0",
]

# Gemini Batch API - install with: uv sync --extra gemini-batch
# Uses the newer google-genai SDK (separate from google-generativeai used by llm extra)
# Env var: GOOGLE_API_KEY
gemini-batch = [
   "google-genai>=1.0.0",
   "pymupdf>=1.26.7",
   "google-cloud-storage>=2.0.0",  # required for Vertex AI mode (GCS input/output)
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
