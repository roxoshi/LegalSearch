services:
  # 1. The Database
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:-search_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-search_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BASE_IMAGE=${BACKEND_BASE_IMAGE:-python:3.13-slim}
    restart: always
    environment:
      # Pass credentials individually so the backend can URL-encode special
      # characters (e.g. '+') via quote_plus — a pre-built DATABASE_URL would
      # embed the raw password and break psycopg2's URL parser.
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in your env file}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      - POSTGRES_DB=${POSTGRES_DB:-search_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your env file}
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      - PDF_DIR=/app/pdfs
      - ACTS_DIR=/app/acts
      - NOTIF_PDF_DIR=/app/notif_pdfs
      - CIRCULAR_PDF_DIR=/app/circular_pdfs
    volumes:
      - ${PDF_DIR:-.data/gst_pdfs}:/app/pdfs:ro
      - ${ACTS_DIR:-.data/acts}:/app/acts:ro
      - ${NOTIF_PDF_DIR:-.data/notifications/pdfs}:/app/notif_pdfs:ro
      - ${CIRCULAR_PDF_DIR:-.data/circulars/pdfs}:/app/circular_pdfs:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # 3. The Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_PORT=${NEXT_PUBLIC_API_PORT:-8000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # 4. MailPit (local SMTP mock — staging only)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
