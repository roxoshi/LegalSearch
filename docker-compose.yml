version: '3.8'

services:
  # 1. The Database
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: search_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  # 2. The Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BASE_IMAGE=${BACKEND_BASE_IMAGE:-python:3.13-slim}
    restart: always
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/search_db
      - SECRET_KEY=08be08689288be14cd7ce26467e2b6491fd8ea2bcdce7fdc565324927e773b23
      - GOOGLE_CLIENT_ID=494421360367-nq4mu434b39869iafmt2lj70ko061t5s.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
    depends_on:
      - db
    ports:
      - "8000:8000"

  # 3. The Frontend (Next.js)
  # NOTE: API URL is now dynamic based on browser hostname - only port needs configuration
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_PORT=8000
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=494421360367-nq4mu434b39869iafmt2lj70ko061t5s.apps.googleusercontent.com
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 4. Shard Service: Extract raw zips + parquet into individual JSON + PDF files
  shard:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BASE_IMAGE=${BACKEND_BASE_IMAGE:-python:3.13-slim}
    profiles: ["ingest"]
    volumes:
      - ./.data:/app/.data
      - ./pipelines:/app/pipelines
    command: >
      python -m pipelines.shard_judgments
      --metadata-dir /app/.data/metadata/raw
      --judgments-dir /app/.data/GST_judgments
      --output-dir /app/.data/metadata/processed
      --pdf-output-dir /app/.data/gst_pdfs

  # 5. Filter Service: ML-based filtering of sharded judgments (GPU optional, falls back to CPU)
  filter:
    build:
      context: .
      dockerfile: pipelines/Dockerfile.filter
      args:
        - BASE_IMAGE=${FILTER_BASE_IMAGE:-pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime}
    profiles: ["ingest"]
    volumes:
      - ./.data:/app/.data
      - ./pipelines:/app/pipelines
    command: >
      python -m pipelines.filter_judgments
      --processed-dir /app/.data/metadata/processed
      --pdf-dir /app/.data/gst_pdfs
    # Uncomment below to enable GPU support (requires NVIDIA GPU and drivers)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      shard:
        condition: service_completed_successfully

  # 6. ETL Ingestion Service: Ingest sharded JSON + PDF into PostgreSQL (legacy multi-step)
  etl:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BASE_IMAGE=${BACKEND_BASE_IMAGE:-python:3.13-slim}
    profiles: ["ingest"]
    volumes:
      - ./.data:/app/.data
      - ./etl:/app/etl
      - ./pipelines:/app/pipelines
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/search_db
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    command: ["python", "etl/ingest.py", "--json-dir", "/app/.data/metadata/processed", "--pdf-dir", "/app/.data/gst_pdfs"]
    depends_on:
      filter:
        condition: service_completed_successfully
      db:
        condition: service_started

  # 7. Unified Pipeline: Optimized single-step ingestion (RECOMMENDED)
  # Combines shard, filter, transform, and ingest into one optimized process
  # with batch embeddings, parallel processing, and bulk database inserts
  unified:
    build:
      context: .
      dockerfile: pipelines/Dockerfile.unified
      args:
        - BASE_IMAGE=${UNIFIED_BASE_IMAGE:-legalsearch-base-unified}
    profiles: ["ingest-fast"]
    volumes:
      - ./.data:/app/.data
      - ./pipelines:/app/pipelines
      - ./etl:/app/etl
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/search_db
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    command: >
      python -m pipelines.unified_pipeline
      --metadata-dir /app/.data/metadata/raw
      --judgments-dir /app/.data/GST_judgments
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
