services:
  # 1. The Database
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:-search_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-search_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BASE_IMAGE=${BACKEND_BASE_IMAGE:-python:3.13-slim}
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-search_db}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your env file}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # 3. The Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_PORT=${NEXT_PUBLIC_API_PORT:-8000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
