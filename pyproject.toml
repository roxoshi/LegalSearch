[tool.uv.workspace]
members = ["backend", "pipelines", "etl"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
    "mypy>=1.8.0",
    "types-tqdm>=4.66.0",
    "types-beautifulsoup4>=4.12.0",
    "pandas-stubs>=2.0.0",
]

[tool.mypy]
python_version = "3.10"
# Relaxed strict mode - enable incrementally
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true

# Ignore missing imports for ML libraries that don't have stubs
[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "fitz.*",
    "pdfplumber.*",
    "sentence_transformers.*",
    "transformers.*",
    "huggingface_hub.*",
    "optimum.*",
    "onnxruntime.*",
    "torch.*",
    "pgvector.*",
    "en_legal_ner_trf.*",
    "app.*",
    "backend.app.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
    "PTH",    # pathlib recommendations (not critical)
    "SIM105", # contextlib.suppress (stylistic)
    "SIM108", # ternary operator (stylistic)
    "SIM117", # nested with statements (stylistic)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ARG001", "ARG005", "B017", "RUF059"]  # Test files: unused args, blind exceptions OK
"**/conftest*.py" = ["ARG001"]
"**/main.py" = ["ARG001"]  # FastAPI lifespan has required signature

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "backend", "etl", "app"]
